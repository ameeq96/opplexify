services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: adon_root
      MYSQL_DATABASE: adon
      MYSQL_USER: adon
      MYSQL_PASSWORD: adon
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
